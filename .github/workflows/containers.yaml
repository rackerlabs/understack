name: Build non-OpenStack containers
on:
  workflow_dispatch:
jobs:
  retag-vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag unchanged v0.8.5 VNC image as v0.8.6
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag ghcr.io/rackerlabs/understack/ironic-vnc-container:v0.8.6 \
            ghcr.io/rackerlabs/understack/ironic-vnc-container@sha256:1cbce0f60ae3a02ec77364fafc65884420027b757c75cd07613059b2dd985831
          docker buildx imagetools inspect ghcr.io/rackerlabs/understack/ironic-vnc-container:v0.8.6
