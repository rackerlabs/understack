name: Build non-OpenStack containers
on:
  workflow_dispatch:
jobs:
  launchpad-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Launchpad from runner
        run: |
          for host in api.launchpad.net ppa.launchpadcontent.net keyserver.ubuntu.com; do
            getent ahosts "$host" || true
            curl -4 -I --connect-timeout 10 --max-time 20 "https://$host" || true
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          buildkitd-config-inline: |
            [dns]
              nameservers = ["1.1.1.1", "8.8.8.8"]
      - name: Probe Launchpad from builder
        run: |
          docker buildx build --progress=plain - <<'EOF'
          FROM curlimages/curl:latest
          RUN curl -4 -I --connect-timeout 10 --max-time 20 https://api.launchpad.net || true
          RUN curl -4 -I --connect-timeout 10 --max-time 20 https://ppa.launchpadcontent.net || true
          RUN curl -4 -I --connect-timeout 10 --max-time 20 https://keyserver.ubuntu.com || true
          EOF
