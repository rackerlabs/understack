name: golangci-lint
on:
  push:
    branches:
      - main
    paths:
      - "go/**"
      - .github/workflows/go-lint.yaml
  pull_request:
    paths:
      - "go/**"
      - .github/workflows/go-lint.yaml
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
    paths:
      - "go/**"
      - .github/workflows/go-lint.yaml

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

env:
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.1.2

jobs:
  # Initial Setup Job
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # List directories and set as output
      - name: List Applications
        id: list_dirs
        run: |
          apps=$(ls -d go/* | xargs -n1 basename)
          app_array=$(printf '%s\n' $apps | jq -R . | jq -cs .)
          echo "apps=${app_array}"
          printf "apps=%s\n" "${app_array}" >> "$GITHUB_OUTPUT"
        shell: bash
    outputs:
      apps: ${{ steps.list_dirs.outputs.apps }}

  golangci-lint:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      # Don't let one module's failure cancel the other modules' lint jobs.
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup.outputs.apps) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      # golangci-lint-action does not install Go, so each module's toolchain
      # comes from its own go.mod rather than a version pinned in this file.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/${{ matrix.app }}/go.mod
          cache-dependency-path: go/${{ matrix.app }}/go.sum

      # install-mode: goinstall builds golangci-lint from source using the
      # toolchain setup-go installed from this module's go.mod. golangci-lint
      # refuses to run when the Go version it was built with is older than the
      # version a module targets, and the published binaries are built with
      # whatever Go was current at release time. Building from source makes
      # build-Go >= target-Go hold by construction, so a dependency bump that
      # raises a module's `go` directive can no longer break linting while
      # GOLANGCI_LINT_VERSION waits on a Renovate PR.
      - name: golangci-lint ${{ matrix.app }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall
          working-directory: go/${{ matrix.app }}
