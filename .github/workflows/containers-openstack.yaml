name: Build OpenStack containers

on:
  push:
    tags:
      - v*
    branches:
      - main
    paths: &triggerpaths
      - "containers/cinder/**"
      - "containers/glance/**"
      - "containers/horizon/**"
      - "containers/ironic/**"
      - "containers/keystone/**"
      - "containers/neutron/**"
      - "containers/nova/**"
      - "containers/octavia/**"
      - "containers/openstack-client/**"
      - "containers/placement/**"
      - "containers/skyline/**"
      - ".github/workflows/containers-openstack.yaml"
      - ".github/workflows/build-container-reuse.yaml"
      - "python/**"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: *triggerpaths
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

jobs:
  openstack:
    strategy:
      matrix:
        project:
          - cinder
          - glance
          - horizon
          - ironic
          - keystone
          - nova
          - neutron
          - placement
          - skyline
          - openstack-client
          - octavia
    uses: ./.github/workflows/build-container-reuse.yaml
    secrets: inherit
    with:
      container_name: ${{ matrix.project }}
      dockerfile_path: containers/${{ matrix.project }}/Dockerfile
      build_args: OPENSTACK_VERSION=2026.1
      latest_name: "2026.1"

  openstack-2026-2:
    strategy:
      matrix:
        include:
          - project: horizon
            openstack_version: "2026.2"
            ubuntu_release: resolute
    uses: ./.github/workflows/build-container-reuse.yaml
    secrets: inherit
    with:
      container_name: ${{ matrix.project }}
      dockerfile_path: containers/${{ matrix.project }}/Dockerfile
      build_args: |
        OPENSTACK_VERSION=${{ matrix.openstack_version }}
        UBUNTU_RELEASE=${{ matrix.ubuntu_release }}
      latest_name: ${{ matrix.openstack_version }}
