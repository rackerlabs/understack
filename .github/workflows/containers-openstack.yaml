name: Build OpenStack containers

on:
  workflow_dispatch:

jobs:
  ironic:
    uses: ./.github/workflows/build-container-reuse.yaml
    secrets: inherit
    with:
      container_name: ironic
      dockerfile_path: containers/ironic/Dockerfile
      build_args: OPENSTACK_VERSION=2026.1
      latest_name: "2026.1"
      prebuild_script: |
        echo 'Runner DNS diagnostics'
        cat /etc/resolv.conf
        getent ahostsv4 archive.ubuntu.com security.ubuntu.com github.com pkgs.k8s.io || true
