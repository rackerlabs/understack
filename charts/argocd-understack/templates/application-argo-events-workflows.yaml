{{- if eq (include "understack.isEnabled" (list $.Values.site "argo_events_workflows")) "true" }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-%s" $.Release.Name "argo-events-workflows" }}
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
{{- include "understack.appLabelsBlock" $ | nindent 2 }}
spec:
  destination:
    namespace: argo-events
    server: {{ $.Values.cluster_server }}
  project: understack
  sources:
  - path: workflows/argo-events
    repoURL: {{ include "understack.understack_url" $ }}
    targetRevision: {{ include "understack.understack_ref" $ }}
    {{- $ref := include "understack.understack_ref" $ }}
    {{- if regexMatch "^v[0-9]+\\.[0-9]+\\.[0-9]+$" $ref }}
    # Run the image built from the same release tag as the workflows. Any other
    # ref (HEAD, main, a branch) has no matching tag, so the templates use latest.
    kustomize:
      images:
        - ghcr.io/rackerlabs/understack/ironic-nautobot-client:{{ $ref }}
    {{- end }}
  - path: {{ include "understack.deploy_path" $ }}/argo-events-workflows
    repoURL: {{ include "understack.deploy_url" $ }}
    targetRevision: {{ include "understack.deploy_ref" $ }}
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      annotations:
        argocd.argoproj.io/sync-options: Delete=false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    - ApplyOutOfSyncOnly=true
{{- end }}
