{{- if eq (include "understack.isEnabled" (list $.Values.global "nautobotop")) "true" }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-%s" $.Release.Name "nautobotop" }}
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
{{- include "understack.appLabelsBlock" $ | nindent 2 }}
spec:
  destination:
    namespace: nautobotop
    server: {{ $.Values.cluster_server }}
  project: understack
  sources:
  - path: charts/nautobotop
    ref: understack
    repoURL: {{ include "understack.understack_url" $ }}
    targetRevision: {{ include "understack.understack_ref" $ }}
    helm:
      ignoreMissingValueFiles: true
      releaseName: nautobotop
      valueFiles:
      - $understack/charts/nautobotop/values.yaml
      - $deploy/{{ include "understack.deploy_path" $ }}/nautobotop/values.yaml
      {{- $ref := include "understack.understack_ref" $ }}
      {{- if regexMatch "^v[0-9]+\\.[0-9]+\\.[0-9]+$" $ref }}
      # Run the image built from the same release tag as the chart. Any other
      # ref (HEAD, main, a branch) has no matching tag, so the chart uses latest.
      parameters:
      - name: understackRef
        value: {{ $ref | quote }}
      {{- end }}
  - path: {{ include "understack.deploy_path" $ }}/nautobotop
    ref: deploy
    repoURL: {{ include "understack.deploy_url" $ }}
    targetRevision: {{ include "understack.deploy_ref" $ }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      annotations:
        argocd.argoproj.io/sync-options: Delete=false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    - ApplyOutOfSyncOnly=true
{{- end }}
