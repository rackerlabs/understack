{{- if .Values.k8sSecretsEventSource.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: keystone-automation-user-upsert
  namespace: openstack
spec:
  template:
    serviceAccountName: k8s-openstack-events-secrets
  # events the Sensor listens for
  dependencies:
    - name: secret-dep
      eventName: keystone-automation-user-upsert
      eventSourceName: k8s-openstack-secrets
  # actions executed when dependencies are satisfied (StandardK8STrigger designed to create or update a generic Kubernetes resource.)
  triggers:
    - template:
        name: keystone-automation-user-upsert
        k8s:
          operation: create
          source:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                generateName: keystone-automation-user-upsert-
              spec:
                ttlSecondsAfterFinished: 600
                backoffLimit: 3
                template:
                  spec:
                    containers:
                      - name: openstackcli
                        image: ghcr.io/rackerlabs/understack/openstack-client:2026.1
                        command: ["sh", "-c"]
                        args:
                          - |
{{ .Files.Get "files/keystone-automation-user-upsert.sh" | indent 28 }}
                        env:
                          - name: EVENT_TYPE
                            value: "placeholder"
                          - name: SECRET_NAME
                            value: "placeholder"
                          - name: LABELS
                            value: "placeholder"
                          - name: ROLES_ANNOTATION
                            value: ""
                        envFrom:
                          - secretRef:
                              name: keystone-keystone-admin
                        volumeMounts:
                          - name: user-create
                            mountPath: /tmp/user-create
                    volumes:
                      - name: user-create
                        secret:
                          secretName: "placeholder"
                    restartPolicy: OnFailure
          parameters:
            - src:
                dependencyName: secret-dep
                dataKey: type
              dest: spec.template.spec.containers.0.env.0.value
            - src:
                dependencyName: secret-dep
                dataKey: body.metadata.name
              dest: spec.template.spec.containers.0.env.1.value
            - src:
                dependencyName: secret-dep
                dataKey: body.metadata.labels
              dest: spec.template.spec.containers.0.env.2.value
            # only this one annotation is passed on; others (e.g.
            # last-applied-configuration) may contain secret data
            - src:
                dependencyName: secret-dep
                dataKey: body.metadata.annotations.understack\.rackspace\.com/keystone-role
                value: ""
              dest: spec.template.spec.containers.0.env.3.value
            - src:
                dependencyName: secret-dep
                dataKey: body.metadata.name
              dest: spec.template.spec.volumes.0.secret.secretName
      retryStrategy:
        steps: 3
        duration: 5s
        factor: 2
        jitter: 1
{{- end }}
