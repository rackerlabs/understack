{{- if .Values.enabled.ironic }}
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: ironic-node-delete
  annotations:
    workflows.argoproj.io/title: Run site cleanup hooks after Ironic Node Deletion
    workflows.argoproj.io/description: |+
      Triggers on the following Ironic Events:

      - baremetal.node.delete.end which happens when a node is deleted

      Routes deletion through delete-server, which runs configured site cleanup
      hooks using the deleted node UUID.

      Defined in `charts/site-workflows/templates/sensor-ironic-node-delete.yaml`
spec:
  dependencies:
  - eventName: openstack
    eventSourceName: openstack-ironic
    name: ironic-dep
    transform:
      # the event is a string-ified JSON so we need to decode it
      # replace the whole event body
      jq: |
        .body = (.body["oslo.message"] | fromjson) |
        .body.ironic_object = (.body.payload["ironic_object.data"] // .body.ironic_object)
    filters:
      # applies each of the items in data with 'and' but there's only one
      dataLogicalOperator: "and"
      data:
        - path: "body.event_type"
          type: "string"
          value:
            - "baremetal.node.delete.end"
  template:
    serviceAccountName: sensor-submit-workflow
  triggers:
    - template:
        name: ironic-node-delete
        # creates workflow object directly via k8s API
        k8s:
          operation: create
          parameters:
            - dest: spec.arguments.parameters.0.value
              src:
                dataKey: body.ironic_object.uuid
                dependencyName: ironic-dep
            # labels make it easy to find workflows for an object, e.g.
            #   kubectl -n argo-events get workflows -l node=<uuid>
            - dest: metadata.labels.node
              src:
                dataKey: body.ironic_object.uuid
                dependencyName: ironic-dep
            - dest: metadata.labels.event-type
              src:
                dataKey: body.event_type
                dependencyName: ironic-dep
          source:
            # create a workflow in argo-events prefixed with ironic-node-delete-
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: ironic-node-delete-
                namespace: argo-events
              spec:
                # defines the parameters being replaced above
                arguments:
                  parameters:
                    - name: node_uuid
                # references the workflow
                workflowTemplateRef:
                  name: delete-server
{{- end }}
