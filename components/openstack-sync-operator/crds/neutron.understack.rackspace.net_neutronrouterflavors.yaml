---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: neutronrouterflavors.neutron.understack.rackspace.net
spec:
  group: neutron.understack.rackspace.net
  names:
    kind: NeutronRouterFlavor
    listKind: NeutronRouterFlavorList
    plural: neutronrouterflavors
    shortNames:
    - nrf
    singular: neutronrouterflavor
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Flavor
      type: string
      jsonPath: .spec.name
    - name: ServiceType
      type: string
      jsonPath: .spec.service_type
    - name: Enabled
      type: boolean
      jsonPath: .spec.is_enabled
    - name: SyncStatus
      type: string
      jsonPath: .status.syncStatus
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        description: >-
          NeutronRouterFlavor defines one Neutron router flavor and the
          service profiles bound to it. Neutron supports many-to-one from
          flavor to service_profile, so ``spec.service_profiles`` is a
          list of profile specs. The operator finds, adopts, or creates each
          profile by ``(driver, meta_info)`` and reconciles the flavor's set
          of bound profiles to match. Creating a CR claims ownership of the
          matching OpenStack flavor and profiles.
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - name
            - service_profiles
            - cloudCredentialsRef
            properties:
              cloudCredentialsRef:
                description: >-
                  cloudCredentialsRef points to a Kubernetes Secret containing
                  an OpenStack clouds.yaml file. The operator reads this secret
                  directly at reconcile time; no volume mount is required.
                type: object
                required:
                - secretName
                - cloudName
                properties:
                  secretName:
                    description: >-
                      Name of a Secret in the same namespace as this resource.
                      The Secret must contain a key named clouds.yaml holding
                      an OpenStack clouds.yaml file.
                    type: string
                    minLength: 1
                    maxLength: 253
                  cloudName:
                    description: >-
                      Name of the cloud entry within the clouds.yaml to
                      authenticate as.
                    type: string
                    minLength: 1
                    maxLength: 256
              name:
                description: Neutron router flavor name.
                type: string
                minLength: 1
                maxLength: 255
                pattern: ^[A-Za-z0-9._-]+$
              service_type:
                description: >-
                  Neutron service type for the flavor. For router flavors this
                  is always L3_ROUTER_NAT (plugin_constants.L3 in neutron-lib).
                type: string
                enum:
                - L3_ROUTER_NAT
                minLength: 1
                maxLength: 255
                default: L3_ROUTER_NAT
              is_enabled:
                description: >-
                  Whether the Neutron router flavor is enabled. The operator
                  reconciles drift toward this value, so setting it to false
                  disables an operator-managed flavor without deleting it.
                type: boolean
                default: true
              description:
                description: Description stored on the Neutron router flavor.
                type: string
                maxLength: 1024
              service_profiles:
                description: >-
                  Service profiles to associate with this flavor. Neutron
                  supports multiple profiles per flavor and the operator
                  reconciles the full set: matching profiles listed here are
                  adopted or created and associated, and any operator-managed
                  profile currently attached to the flavor but absent from
                  this list is disassociated. Unmanaged profiles attached
                  out-of-band are left untouched unless they match this spec.
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                  - driver
                  properties:
                    driver:
                      description: Service profile driver class.
                      type: string
                      minLength: 1
                      maxLength: 1024
                      pattern: ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)+$
                    description:
                      description: Description stored on the Neutron service profile.
                      type: string
                      maxLength: 1024
                    is_enabled:
                      description: Whether the service profile is enabled in Neutron.
                      type: boolean
                      default: true
                    meta_info:
                      description: Service profile metadata payload.
                      type: object
                      properties:
                        resource_class:
                          description: Resource class consumed by a physical router provider.
                          type: string
                          minLength: 1
                          maxLength: 255
                          pattern: ^[A-Za-z0-9._:-]+$
                        vni_alloc:
                          description: VNI allocation mode for VRF router providers.
                          type: string
                          enum:
                          - "off"
                          - "on"
                          - auto
          status:
            description: NeutronRouterFlavorStatus defines the observed sync state.
            type: object
            properties:
              syncStatus:
                description: SyncStatus indicates the synchronization state with Neutron.
                type: string
                enum:
                - Synced
                - Failed
                - Unknown
              lastSyncTime:
                description: LastSyncTime is the last time the operator attempted to sync the flavor.
                type: string
                format: date-time
              observedGeneration:
                description: ObservedGeneration is the metadata generation last processed by the operator.
                type: integer
                format: int64
              message:
                description: Message provides details about the last sync attempt.
                type: string
                maxLength: 2048
              conditions:
                description: Conditions describe current observed state.
                type: array
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                    reason:
                      type: string
                    message:
                      type: string
                      maxLength: 2048
                    lastTransitionTime:
                      type: string
                      format: date-time
    subresources:
      status: {}
