---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: neutronsubnetpools.neutron.understack.rackspace.net
spec:
  group: neutron.understack.rackspace.net
  names:
    kind: NeutronSubnetPool
    listKind: NeutronSubnetPoolList
    plural: neutronsubnetpools
    shortNames:
    - nsp
    singular: neutronsubnetpool
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Pool
      type: string
      jsonPath: .spec.name
    - name: IPVersion
      type: integer
      jsonPath: .spec.ip_version
    - name: AddressScope
      type: string
      jsonPath: .spec.address_scope.name
    - name: Shared
      type: boolean
      jsonPath: .spec.shared
    - name: SyncStatus
      type: string
      jsonPath: .status.syncStatus
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        description: >-
          NeutronSubnetPool defines one Neutron subnet pool and links it to a
          Neutron address scope. Neutron stores that link as address_scope_id on
          the subnet pool; Understack L3/SVI validation relies on subnets
          inheriting that address scope through their subnet pool.
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - name
            - prefixes
            - address_scope
            - cloudCredentialsRef
            properties:
              cloudCredentialsRef:
                description: >-
                  cloudCredentialsRef points to a Kubernetes Secret containing
                  an OpenStack clouds.yaml file. The operator reads this secret
                  directly at reconcile time; no volume mount is required.
                type: object
                required:
                - secretName
                - cloudName
                properties:
                  secretName:
                    description: >-
                      Name of a Secret in the same namespace as this resource.
                      The Secret must contain a key named clouds.yaml holding
                      an OpenStack clouds.yaml file.
                    type: string
                    minLength: 1
                    maxLength: 253
                  cloudName:
                    description: >-
                      Name of the cloud entry within the clouds.yaml to
                      authenticate as.
                    type: string
                    minLength: 1
                    maxLength: 256
              name:
                description: Neutron subnet pool name.
                type: string
                minLength: 1
                maxLength: 255
                pattern: ^[A-Za-z0-9._-]+$
              project_id:
                description: >-
                  Optional OpenStack project ID to create the subnet pool in and
                  to use when resolving an address scope by name.
                type: string
                minLength: 1
                maxLength: 255
                pattern: ^[A-Za-z0-9._:-]+$
              address_scope:
                description: >-
                  Address scope to attach to the Neutron subnet pool. Use id for
                  an exact lookup, or name with optional project_id when the
                  address scope name is unique for the selected cloud.
                type: object
                oneOf:
                - required:
                  - id
                - required:
                  - name
                properties:
                  id:
                    description: Neutron address scope ID.
                    type: string
                    minLength: 1
                    maxLength: 36
                    pattern: ^[A-Fa-f0-9-]+$
                  name:
                    description: Neutron address scope name.
                    type: string
                    minLength: 1
                    maxLength: 255
                  project_id:
                    description: >-
                      Optional project ID used only when resolving this address
                      scope by name. Defaults to spec.project_id when omitted.
                    type: string
                    minLength: 1
                    maxLength: 255
                    pattern: ^[A-Za-z0-9._:-]+$
              prefixes:
                description: CIDR prefixes delegated by the Neutron subnet pool.
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^(([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}|[0-9A-Fa-f:.]+/[0-9]{1,3})$
              ip_version:
                description: >-
                  IP version for the subnet pool. Neutron derives this from
                  prefixes; the operator uses this optional value to validate
                  prefixes and address-scope family before creating the pool.
                type: integer
                enum:
                - 4
                - 6
              default_prefixlen:
                description: Default prefix length allocated from this pool.
                type: integer
                minimum: 0
                maximum: 128
              min_prefixlen:
                description: Smallest prefix length that may be allocated.
                type: integer
                minimum: 0
                maximum: 128
              max_prefixlen:
                description: Largest prefix length that may be allocated.
                type: integer
                minimum: 0
                maximum: 128
              default_quota:
                description: Per-project subnet quota for this pool.
                type: integer
                minimum: 0
              is_default:
                description: Whether this is the default pool for its IP version.
                type: boolean
                default: false
              shared:
                description: Whether the Neutron subnet pool is shared.
                type: boolean
                default: false
              description:
                description: Description stored on the Neutron subnet pool.
                type: string
                maxLength: 1024
              tags:
                description: Neutron tags to apply to the subnet pool.
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 255
          status:
            description: NeutronSubnetPoolStatus defines the observed sync state.
            type: object
            properties:
              syncStatus:
                description: SyncStatus indicates the synchronization state with Neutron.
                type: string
                enum:
                - Synced
                - Failed
                - Unknown
              lastSyncTime:
                description: LastSyncTime is the last time the operator attempted to sync the subnet pool.
                type: string
                format: date-time
              observedGeneration:
                description: ObservedGeneration is the metadata generation last processed by the operator.
                type: integer
                format: int64
              message:
                description: Message provides details about the last sync attempt.
                type: string
                maxLength: 2048
              conditions:
                description: Conditions describe current observed state.
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - type
                items:
                  type: object
                  required:
                  - type
                  - status
                  - reason
                  - message
                  - lastTransitionTime
                  properties:
                    type:
                      description: >-
                        Condition type in CamelCase. A CR reports one
                        condition, Ready.
                      type: string
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                    status:
                      type: string
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                    reason:
                      description: >-
                        CamelCase programmatic identifier for the reason of the
                        last transition.
                      type: string
                      minLength: 1
                      maxLength: 1024
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                    message:
                      type: string
                      maxLength: 2048
                    observedGeneration:
                      description: >-
                        The metadata.generation this condition was computed
                        from. A value behind the current generation means the
                        condition is out of date.
                      type: integer
                      format: int64
                      minimum: 0
                    lastTransitionTime:
                      type: string
                      format: date-time
    subresources:
      status: {}
