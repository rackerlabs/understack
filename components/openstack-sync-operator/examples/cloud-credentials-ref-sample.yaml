# cloudCredentialsRef — sample manifests
#
# Every openstack-sync CRD that reconciles against OpenStack carries a
# spec.cloudCredentialsRef block.  It tells the operator which Kubernetes
# Secret holds the clouds.yaml and which cloud entry within that file to
# authenticate as.  No volume mounts or operator-level cloud config are
# required — each resource is self-describing.
#
# Structure
# ---------
#   spec:
#     cloudCredentialsRef:
#       secretName: <name of Secret in the same namespace>
#       cloudName:  <cloud entry in that Secret's clouds.yaml>
#
# The referenced Secret must contain a key named "clouds.yaml" with a
# standard OpenStack clouds.yaml file as its value.

---
# 1. The Secret
#
# Create one Secret per credential set.  A single Secret can hold a
# clouds.yaml with multiple cloud entries; each CR then picks the entry
# it needs via cloudName.
#
# In production this Secret is typically managed by an ExternalSecret or
# a similar secrets-sync mechanism rather than applied directly.
apiVersion: v1
kind: Secret
metadata:
  name: infrasetup
  namespace: openstack
type: Opaque
stringData:
  clouds.yaml: |
    clouds:
      understack:
        auth:
          auth_url: https://keystone.example.com:5000/v3
          username: admin
          password: supersecret
          project_name: admin
          user_domain_name: Default
          project_domain_name: Default
        region_name: RegionOne
        identity_api_version: 3
      baremetal-manage:
        auth:
          auth_url: https://keystone.example.com:5000/v3
          username: baremetal
          password: anothersecret
          project_name: baremetal
          user_domain_name: Default
          project_domain_name: Default
        region_name: RegionOne
        identity_api_version: 3

---
# 2. NeutronRouterFlavor using the "understack" cloud entry
#
# This is the typical case: a single shared Secret in the namespace,
# and each CR points at the cloud entry relevant to its workload.
apiVersion: neutron.understack.rackspace.net/v1alpha1
kind: NeutronRouterFlavor
metadata:
  name: standard-l3-router
  namespace: openstack
spec:
  cloudCredentialsRef:
    secretName: infrasetup   # Secret in the same namespace
    cloudName: understack    # Entry inside that Secret's clouds.yaml
  name: standard-l3-router
  driver: neutron_lib.services.l3.L3ServicePlugin
  service_type: L3_ROUTER_NAT
  description: Standard L3 router flavor

---
# 3. NeutronRouterFlavor using a different cloud entry in the same Secret
#
# A second CR in the same namespace can point at a different cloud entry
# without needing a separate Secret.
apiVersion: neutron.understack.rackspace.net/v1alpha1
kind: NeutronRouterFlavor
metadata:
  name: baremetal-l3-router
  namespace: openstack
spec:
  cloudCredentialsRef:
    secretName: infrasetup        # same Secret …
    cloudName: baremetal-manage   # … different cloud entry
  name: baremetal-l3-router
  driver: neutron_lib.services.l3.L3ServicePlugin
  service_type: L3_ROUTER_NAT
  description: L3 router flavor for baremetal workloads

---
# 4. NeutronRouterFlavor using a dedicated per-tenant Secret
#
# For stricter isolation each CR can reference its own Secret.  RBAC on
# the Secret controls which service accounts can read it independently of
# other credentials in the namespace.
apiVersion: v1
kind: Secret
metadata:
  name: tenant-a-credentials
  namespace: openstack
type: Opaque
stringData:
  clouds.yaml: |
    clouds:
      tenant-a:
        auth:
          auth_url: https://keystone.example.com:5000/v3
          username: tenant-a-svc
          password: tenantasecret
          project_name: tenant-a
          user_domain_name: Default
          project_domain_name: Default
        region_name: RegionOne
        identity_api_version: 3
---
apiVersion: neutron.understack.rackspace.net/v1alpha1
kind: NeutronRouterFlavor
metadata:
  name: tenant-a-router
  namespace: openstack
spec:
  cloudCredentialsRef:
    secretName: tenant-a-credentials  # dedicated Secret
    cloudName: tenant-a
  name: tenant-a-router
  driver: neutron_lib.services.l3.L3ServicePlugin
  service_type: L3_ROUTER_NAT
  description: Router flavor scoped to tenant-a credentials
