replicaCount: 1

# Operator-level environment variables injected directly into the container.
# LOG_LEVEL controls both shell-operator and Python hook logging.
env:
  LOG_LEVEL: info

image:
  repository: ghcr.io/rackerlabs/understack/openstack-sync-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # tag: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true
  clusterWide: false

# Built-in hook configuration. Site values normally override only:
# - plugins.<name>: enable or disable a hook
# - pluginData.<name>.hook.env: override selected hook env values
#
# Helm turns these hook settings into a checksum on the Deployment pod template.
# When these values change, the checksum changes, so Kubernetes restarts the pod.
# That restart is required because shell-operator reads hook watches only when
# the pod starts.
plugins:
  openstackPlaceholder: false
  neutronRouterFlavors: false

pluginData:
  openstackPlaceholder:
    hook:
      path: /hooks/placeholder.py
      crd: crds/openstack.understack.rackspace.net_openstackplaceholders.yaml
      envPrefix: OPENSTACK_PLACEHOLDER
      env:
        DEFAULT_SECRET: infrasetup
        DEFAULT_CLOUD: understack

  neutronRouterFlavors:
    hook:
      path: /hooks/router_flavors.py
      crd: crds/neutron.understack.rackspace.net_neutronrouterflavors.yaml
      envPrefix: NEUTRON_ROUTER_FLAVOR
      env:
        SYNC_CRONTAB: "0 * * * *"
        # Neutron readiness wait before a router flavor reconcile fails.
        # Total wait is READY_RETRIES * READY_DELAY seconds.
        READY_RETRIES: 30
        READY_DELAY: 10
        # When true, removing a NeutronRouterFlavor CR also deletes its unused
        # operator-managed OpenStack flavor. Enable this before removing the CR.
        PRUNE: false
