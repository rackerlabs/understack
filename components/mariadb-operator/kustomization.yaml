---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

helmGlobals:
  chartHome: ../../charts/

helmCharts:
- name: mariadb-operator
  namespace: mariadb-operator
  valuesFile: values.yaml
  releaseName: mariadb-operator
  version: 26.6.0
  repo: oci://ghcr.io/mariadb-operator/charts
  valuesInline:
    crds:
      enabled: false
