# Defaults: https://github.com/mariadb-operator/mariadb-operator/blob/main/deploy/charts/mariadb-operator/values.yaml

metrics:
  enabled: true

config:
  # stick with OpenStack's officially supported version
  mariadbDefaultVersion: "11.4"
  # operator < 26.3 takes the image as a single string
  mariadbImage: docker-registry1.mariadb.com/library/mariadb:11.4.10
