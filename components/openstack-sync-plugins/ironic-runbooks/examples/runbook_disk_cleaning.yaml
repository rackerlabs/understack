# Disk Cleaning Runbook
#
# This runbook performs secure disk erasure for node reuse.
# Common use case: Preparing nodes for redeployment or decommissioning.
#
# Selects nodes carrying the trait: CUSTOM_DISK_CLEAN

apiVersion: ironic.understack.rackspace.net/v1alpha1
kind: IronicRunbook
metadata:
  name: disk-cleaning
  namespace: baremetal-system
  labels:
    use-case: disk-cleaning
    security-level: standard
spec:
  # REQUIRED: Secret holding the clouds.yaml, and the cloud entry to use.
  cloudCredentialsRef:
    secretName: infrasetup-system
    cloudName: understack

  runbookName: CUSTOM_DISK_CLEAN

  # Fleet-wide operator tooling, so every project may see it. public governs
  # visibility only: Ironic authorises a clean or service request against the
  # runbook's owner, so a public runbook is usable by a system-scoped or
  # role:service token and not by a project-scoped one. Set spec.owner instead
  # to hand use to one project. A runbook that is neither public nor owned can
  # be seen and used by nobody.
  public: true

  # Nodes must carry at least one of these traits for this runbook to act on them.
  traits:
    - CUSTOM_DISK_CLEAN

  steps:
    # Step 1: Erase all devices
    - interface: deploy
      step: erase_devices
      order: 1
      args:
        # Empty list means erase all devices
        erase_skip_list: []

  extra:
    description: "Standard disk cleaning for node reuse"
    version: "1.0.0"
    use_case: "Secure disk erasure before redeployment"
    security_level: "standard"
    notes: |
      This runbook performs a standard disk erase on all storage devices.

      Erase method depends on Ironic configuration:
      - ATA Secure Erase (if supported by drive)
      - NVMe Format (for NVMe drives)
      - Software-based shred (fallback)

      For high-security environments, consider:
      - Multiple pass overwrite
      - DoD 5220.22-M standard
      - Physical destruction for decommissioning
    estimated_duration: "30-120 minutes depending on disk size and method"
