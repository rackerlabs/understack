---
# Allows the ironic-conductor init container and the oidc-cert-refresh CronJob
# to create and update the ironic-oidc-https-cert ConfigMap that holds the
# current dex TLS certificate pushed to iDRAC by set_oidc_config.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ironic-oidc-cert-refresh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ironic-oidc-cert
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [ironic-oidc-https-cert]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
---
# ironic-conductor SA -- used by the bmc-sso-cert-init init container
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ironic-oidc-cert-conductor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ironic-oidc-cert
subjects:
  - kind: ServiceAccount
    name: ironic-conductor
---
# ironic-oidc-cert-refresh SA -- used by the CronJob
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ironic-oidc-cert-refresh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ironic-oidc-cert
subjects:
  - kind: ServiceAccount
    name: ironic-oidc-cert-refresh
