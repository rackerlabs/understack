---
apiVersion: v1
kind: Service
metadata:
  name: ironic-dnsmasq
  labels:
    application: ironic-dnsmasq
spec:
  ports:
  - name: dns
    port: 53
    protocol: UDP
  clusterIP: None
  selector:
    application: ironic-dnsmasq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ironic-dnsmasq
  namespace: openstack
spec:
  replicas: 1
  selector:
    matchLabels:
      application: ironic-dnsmasq
  template:
    metadata:
      labels:
        application: ironic-dnsmasq
    spec:
      hostNetwork: true
      containers:
        - name: dnsmasq
          image: ghcr.io/rackerlabs/understack/dnsmasq:pr-2111
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add: ["NET_BIND_SERVICE"]
          args:
            - /usr/sbin/dnsmasq
            - '--no-daemon'
          envFrom:
            - configMapRef:
                name: ironic-dnsmasq
                optional: true
          ports:
            - name: dns
              containerPort: 53
              protocol: UDP
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: pod-dnsmasq-d
              mountPath: /etc/dnsmasq.d
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: pod-dnsmasq-d
          emptyDir: {}
