---
apiVersion: argoproj.io/v1alpha1
metadata:
  name: enroll-server
  annotations:
    workflows.argoproj.io/title: Perform server discovery and update Ironic
    workflows.argoproj.io/description: |
      Defined in `workflows/argo-events/workflowtemplates/enroll-server.yaml`

      The workflow reads site-specific configuration from the
      `enroll-server-config` ConfigMap. During enrollment, it runs
      `post_inspection_runbooks` before providing the node. After enrollment,
      it runs the templates listed in `post_enroll_workflows`.
kind: WorkflowTemplate
spec:
  # Labels make runs filterable in the Argo UI (`argo list -l`) and give
  # alerts a stable key. Per-target labels are added at submission time.
  workflowMetadata:
    labels:
      understack.rackspace.com/workflow-kind: enroll
      understack.rackspace.com/device-type: server
  serviceAccountName: workflow
  entrypoint: main
  volumes:
    - name: enrollment-result
      emptyDir: {}
    - name: bmc-master
      secret:
        secretName: bmc-master
    - name: baremetal-manage
      secret:
        secretName: baremetal-manage
        items:
          - key: clouds.yaml
            path: clouds.yaml
  arguments:
    parameters:
      - name: ip_address
      - name: post_inspection_runbooks
        valueFrom:
          configMapKeyRef:
            name: enroll-server-config
            key: post_inspection_runbooks
          default: "[]"
      - name: firmware_update
        value: "false"
      - name: raid_configure
        value: "true"
      - name: old_password
        value: calvin
      - name: external_cmdb_id
        value: ""
  templates:
    - name: main
      inputs:
        parameters:
          - name: post_inspection_runbooks
            value: "{{workflow.parameters.post_inspection_runbooks}}"
          # A site can configure this value with a JSON array of
          # WorkflowTemplate names. Each WorkflowTemplate must expose a `run`
          # template that accepts `node_uuid`. If the ConfigMap is absent, no
          # post-enrollment templates are run.
          - name: post_enroll_workflows
            valueFrom:
              configMapKeyRef:
                name: enroll-server-config
                key: post_enroll_workflows
              default: "[]"
      outputs:
        parameters:
          - name: node_uuid
            valueFrom:
              parameter: "{{steps.enroll-server.outputs.parameters.node_uuid}}"
      steps:
        - - name: enroll-server
            template: enroll-server
            arguments:
              parameters:
                - name: post_inspection_runbooks
                  value: "{{inputs.parameters.post_inspection_runbooks}}"
        - - name: post-enroll
            templateRef:
              name: "{{item}}"
              template: run
            arguments:
              parameters:
                - name: node_uuid
                  value: "{{steps.enroll-server.outputs.parameters.node_uuid}}"
            withParam: "{{inputs.parameters.post_enroll_workflows}}"
    - name: enroll-server
      inputs:
        parameters:
          - name: post_inspection_runbooks
      outputs:
        parameters:
          - name: node_uuid
            valueFrom:
              path: /run/enrollment/node-uuid
      container:
        image: ghcr.io/rackerlabs/understack/ironic-nautobot-client:latest
        command:
          - enroll-server
        args:
          - --node-uuid-output
          - /run/enrollment/node-uuid
          - --ip-address
          - "{{workflow.parameters.ip_address}}"
          - --post-inspection-runbooks
          - "{{inputs.parameters.post_inspection_runbooks}}"
          - --firmware-update
          - "{{workflow.parameters.firmware_update}}"
          - --raid-configure
          - "{{workflow.parameters.raid_configure}}"
          - --old-password
          - "{{workflow.parameters.old_password}}"
          - --external-cmdb-id
          - "{{workflow.parameters.external_cmdb_id}}"
        volumeMounts:
          - mountPath: /run/enrollment
            name: enrollment-result
          - mountPath: /etc/openstack
            name: baremetal-manage
            readOnly: true
          - mountPath: /etc/bmc_master/
            name: bmc-master
            readOnly: true
        envFrom:
          - configMapRef:
              name: cluster-metadata
        env:
          - name: WF_NS
            value: "{{workflow.namespace}}"
          - name: WF_NAME
            value: "{{workflow.name}}"
          - name: WF_UID
            value: "{{workflow.uid}}"
          - name: OS_CLOUD
            value: understack
