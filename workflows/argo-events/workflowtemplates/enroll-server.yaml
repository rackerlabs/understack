---
apiVersion: argoproj.io/v1alpha1
metadata:
  name: enroll-server
  annotations:
    workflows.argoproj.io/title: Perform server discovery and update Ironic
    workflows.argoproj.io/description: |
      Defined in `workflows/argo-events/workflowtemplates/enroll-server.yaml`

      The workflow reads site-specific configuration from the
      `enroll-server-config` ConfigMap. After enrollment, it runs the templates
      listed in `post_enroll_workflows`.
kind: WorkflowTemplate
spec:
  serviceAccountName: workflow
  entrypoint: main
  volumes:
    - name: enrollment-result
      emptyDir: {}
    - name: bmc-master
      secret:
        secretName: bmc-master
    - name: baremetal-manage
      secret:
        secretName: baremetal-manage
        items:
          - key: clouds.yaml
            path: clouds.yaml
  arguments:
    parameters:
      - name: ip_address
      - name: firmware_update
        value: "false"
      - name: raid_configure
        value: "true"
      - name: old_password
        value: calvin
      - name: external_cmdb_id
        value: ""
  templates:
    - name: main
      inputs:
        parameters:
          # A site can configure this value with a JSON array of
          # WorkflowTemplate names. Each WorkflowTemplate must expose a `run`
          # template that accepts `node_uuid`. If the ConfigMap is absent, no
          # post-enrollment templates are run. Entries run in list order, and
          # a failure prevents subsequent entries from running.
          - name: post_enroll_workflows
            valueFrom:
              configMapKeyRef:
                name: enroll-server-config
                key: post_enroll_workflows
              default: "[]"
      outputs:
        parameters:
          - name: node_uuid
            valueFrom:
              parameter: "{{steps.enroll-server.outputs.parameters.node_uuid}}"
      steps:
        - - name: enroll-server
            template: enroll-server
        - - name: post-enroll
            template: post-enroll-sequence
            when: "{{=len(fromJSON(inputs.parameters.post_enroll_workflows)) > 0}}"
            arguments:
              parameters:
                - name: node_uuid
                  value: "{{steps.enroll-server.outputs.parameters.node_uuid}}"
                - name: workflows
                  value: "{{inputs.parameters.post_enroll_workflows}}"
    # Recurse over the remaining names only after the current hook succeeds.
    # A withParam loop would schedule independent hooks concurrently.
    - name: post-enroll-sequence
      inputs:
        parameters:
          - name: node_uuid
          - name: workflows
      steps:
        - - name: run-workflow
            templateRef:
              name: "{{item}}"
              template: run
            arguments:
              parameters:
                - name: node_uuid
                  value: "{{inputs.parameters.node_uuid}}"
            # Expand only the first entry; the next step handles the tail.
            withParam: "{{=toJson(fromJSON(inputs.parameters.workflows)[:1])}}"
        - - name: remaining-workflows
            template: post-enroll-sequence
            when: "{{=len(fromJSON(inputs.parameters.workflows)) > 1}}"
            arguments:
              parameters:
                - name: node_uuid
                  value: "{{inputs.parameters.node_uuid}}"
                - name: workflows
                  value: "{{=toJson(fromJSON(inputs.parameters.workflows)[1:])}}"
    - name: enroll-server
      outputs:
        parameters:
          - name: node_uuid
            valueFrom:
              path: /run/enrollment/node-uuid
      container:
        image: ghcr.io/rackerlabs/understack/ironic-nautobot-client:pr-2608
        command:
          - enroll-server
        args:
          - --node-uuid-output
          - /run/enrollment/node-uuid
          - --ip-address
          - "{{workflow.parameters.ip_address}}"
          - --firmware-update
          - "{{workflow.parameters.firmware_update}}"
          - --raid-configure
          - "{{workflow.parameters.raid_configure}}"
          - --old-password
          - "{{workflow.parameters.old_password}}"
          - --external-cmdb-id
          - "{{workflow.parameters.external_cmdb_id}}"
        volumeMounts:
          - mountPath: /run/enrollment
            name: enrollment-result
          - mountPath: /etc/openstack
            name: baremetal-manage
            readOnly: true
          - mountPath: /etc/bmc_master/
            name: bmc-master
            readOnly: true
        envFrom:
          - configMapRef:
              name: cluster-metadata
        env:
          - name: WF_NS
            value: "{{workflow.namespace}}"
          - name: WF_NAME
            value: "{{workflow.name}}"
          - name: WF_UID
            value: "{{workflow.uid}}"
          - name: OS_CLOUD
            value: understack
