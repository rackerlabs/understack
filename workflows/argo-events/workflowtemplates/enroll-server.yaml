---
apiVersion: argoproj.io/v1alpha1
metadata:
  name: enroll-server
  annotations:
    workflows.argoproj.io/title: Perform server discovery and update Ironic
    workflows.argoproj.io/description: |
      Defined in `workflows/argo-events/workflowtemplates/enroll-server.yaml`
kind: WorkflowTemplate
spec:
  serviceAccountName: workflow
  entrypoint: main
  volumes:
    - name: enrollment-result
      emptyDir: {}
    - name: bmc-master
      secret:
        secretName: bmc-master
    - name: baremetal-manage
      secret:
        secretName: baremetal-manage
        items:
          - key: clouds.yaml
            path: clouds.yaml
  arguments:
    parameters:
      - name: ip_address
      - name: post_inspection_runbooks
        value: "[]"
      - name: firmware_update
        value: "false"
      - name: raid_configure
        value: "true"
      - name: old_password
        value: calvin
      - name: external_cmdb_id
        value: ""
      # Optional post-enrollment hook. "false" (default) = no hook, behaviour
      # unchanged. A site opts in by setting "true" AND installing an
      # `enroll-post-hook` WorkflowTemplate (entrypoint `run`, input param
      # `node_uuid`) in the workflow namespace. The ref name is intentionally
      # static: Argo resolves templateRef.name at parse time, so it cannot be a
      # parameter. Each site decides what enroll-post-hook does.
      - name: post_enroll_hook
        value: "false"
  templates:
    - name: main
      outputs:
        parameters:
          - name: node_uuid
            valueFrom:
              parameter: "{{steps.enroll-server.outputs.parameters.node_uuid}}"
      steps:
        - - name: enroll-server
            template: enroll-server
        # Runs only when the site enabled the hook. This step is a generic
        # delegator and does not know about any specific integration.
        - - name: post-enroll
            when: "{{workflow.parameters.post_enroll_hook}} == true"
            templateRef:
              name: enroll-post-hook
              template: run
            arguments:
              parameters:
                - name: node_uuid
                  value: "{{steps.enroll-server.outputs.parameters.node_uuid}}"
    - name: enroll-server
      outputs:
        parameters:
          - name: node_uuid
            valueFrom:
              path: /run/enrollment/node-uuid
      container:
        image: ghcr.io/rackerlabs/understack/ironic-nautobot-client:latest
        command:
          - enroll-server
        args:
          - --node-uuid-output
          - /run/enrollment/node-uuid
          - --ip-address
          - "{{workflow.parameters.ip_address}}"
          - --post-inspection-runbooks
          - "{{workflow.parameters.post_inspection_runbooks}}"
          - --firmware-update
          - "{{workflow.parameters.firmware_update}}"
          - --raid-configure
          - "{{workflow.parameters.raid_configure}}"
          - --old-password
          - "{{workflow.parameters.old_password}}"
          - --external-cmdb-id
          - "{{workflow.parameters.external_cmdb_id}}"
        volumeMounts:
          - mountPath: /run/enrollment
            name: enrollment-result
          - mountPath: /etc/openstack
            name: baremetal-manage
            readOnly: true
          - mountPath: /etc/bmc_master/
            name: bmc-master
            readOnly: true
        envFrom:
          - configMapRef:
              name: cluster-metadata
        env:
          - name: WF_NS
            value: "{{workflow.namespace}}"
          - name: WF_NAME
            value: "{{workflow.name}}"
          - name: WF_UID
            value: "{{workflow.uid}}"
          - name: OS_CLOUD
            value: understack
