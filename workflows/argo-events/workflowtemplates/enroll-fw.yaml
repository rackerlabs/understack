---
apiVersion: argoproj.io/v1alpha1
metadata:
  name: enroll-fw
  annotations:
    workflows.argoproj.io/title: Enroll a firewall in Ironic
    workflows.argoproj.io/description: |
      Defined in `workflows/argo-events/workflowtemplates/enroll-fw.yaml`.
      Reuses enroll-netdev for the node/port lifecycle and additionally records
      firewall management details in driver_info and the HA mate serial in extra.
      Defaults to the panos hardware type. Without ports, it inspects the
      firewall to discover and label them, and only then makes it available.

      The workflow reads site-specific configuration from the
      `enroll-fw-config` ConfigMap. After enrollment, it runs the templates
      listed in `post_enroll_workflows`.
kind: WorkflowTemplate
spec:
  # Labels make runs filterable in the Argo UI (`argo list -l`) and give
  # alerts a stable key. Per-target labels are added at submission time.
  workflowMetadata:
    labels:
      understack.rackspace.com/workflow-kind: enroll
      understack.rackspace.com/device-type: fw
  serviceAccountName: workflow
  entrypoint: main
  volumes:
    - name: enrollment-result
      emptyDir: {}
    - name: baremetal-manage
      secret:
        secretName: baremetal-manage
        items:
          - key: clouds.yaml
            path: clouds.yaml
  arguments:
    parameters:
      - name: name
      # Needed only with ports.
      - name: physical_network
        value: ""
      # JSON array of ports (same format as enroll-netdev). Leave it as [] to
      # let inspection discover and label the ports.
      - name: ports
        value: "[]"
      - name: external_cmdb_id
        value: ""
      - name: resource_class
      # Firewall management/identity metadata. management_* land in the node's
      # driver_info; mate_serial lands in extra.
      # management_switch + management_switch_port are REQUIRED (no default)
      - name: management_ip
        value: ""
      - name: management_switch
      - name: management_switch_port
      - name: mate_serial
        value: ""
      # Device identity, read by the Nautobot device sync. serial -> extra;
      # vendor/model -> properties. 'switch' in ports must be the switch FQDN.
      - name: serial
        value: ""
      - name: vendor
        value: "Palo Alto"
      - name: driver
        value: "panos"
      - name: model
        value: ""
  templates:
    - name: main
      inputs:
        parameters:
          - name: post_enroll_workflows
            valueFrom:
              configMapKeyRef:
                name: enroll-fw-config
                key: post_enroll_workflows
              default: "[]"
      outputs:
        parameters:
          - name: node_uuid
            valueFrom:
              parameter: "{{steps.enroll-fw.outputs.parameters.node_uuid}}"
      steps:
        - - name: enroll-fw
            template: enroll-fw
        - - name: post-enroll
            templateRef:
              name: "{{item}}"
              template: run
            arguments:
              parameters:
                - name: node_uuid
                  value: "{{steps.enroll-fw.outputs.parameters.node_uuid}}"
            withParam: "{{inputs.parameters.post_enroll_workflows}}"
    - name: enroll-fw
      outputs:
        parameters:
          - name: node_uuid
            valueFrom:
              path: /run/enrollment/node-uuid
      container:
        image: ghcr.io/rackerlabs/understack/ironic-nautobot-client:latest
        command:
          - enroll-fw
        args:
          - --node-uuid-output
          - /run/enrollment/node-uuid
          - --name
          - "{{workflow.parameters.name}}"
          - --physical-network
          - "{{workflow.parameters.physical_network}}"
          - --ports
          - "{{workflow.parameters.ports}}"
          - --external-cmdb-id
          - "{{workflow.parameters.external_cmdb_id}}"
          - --resource-class
          - "{{workflow.parameters.resource_class}}"
          - --driver
          - "{{workflow.parameters.driver}}"
          - --management-ip
          - "{{workflow.parameters.management_ip}}"
          - --management-switch
          - "{{workflow.parameters.management_switch}}"
          - --management-switch-port
          - "{{workflow.parameters.management_switch_port}}"
          - --mate-serial
          - "{{workflow.parameters.mate_serial}}"
          - --serial
          - "{{workflow.parameters.serial}}"
          - --vendor
          - "{{workflow.parameters.vendor}}"
          - --model
          - "{{workflow.parameters.model}}"
        volumeMounts:
          - mountPath: /run/enrollment
            name: enrollment-result
          - mountPath: /etc/openstack
            name: baremetal-manage
            readOnly: true
        envFrom:
          - configMapRef:
              name: cluster-metadata
        env:
          - name: WF_NS
            value: "{{workflow.namespace}}"
          - name: WF_NAME
            value: "{{workflow.name}}"
          - name: WF_UID
            value: "{{workflow.uid}}"
          - name: OS_CLOUD
            value: understack
