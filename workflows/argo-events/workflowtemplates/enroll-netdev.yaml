---
apiVersion: argoproj.io/v1alpha1
metadata:
  name: enroll-netdev
  annotations:
    workflows.argoproj.io/title: Enroll a network device in Ironic
    workflows.argoproj.io/description: |
      Defined in `workflows/argo-events/workflowtemplates/enroll-netdev.yaml`

      The workflow reads site-specific configuration from the
      `enroll-netdev-config` ConfigMap. After enrollment, it runs the templates
      listed in `post_enroll_workflows`.
kind: WorkflowTemplate
spec:
  # Labels make runs filterable in the Argo UI (`argo list -l`) and give
  # alerts a stable key. Per-target labels are added at submission time.
  workflowMetadata:
    labels:
      understack.rackspace.com/workflow-kind: enroll
      understack.rackspace.com/device-type: netdev
  serviceAccountName: workflow
  entrypoint: main
  volumes:
    - name: enrollment-result
      emptyDir: {}
    - name: baremetal-manage
      secret:
        secretName: baremetal-manage
        items:
          - key: clouds.yaml
            path: clouds.yaml
  arguments:
    parameters:
      - name: name
      - name: physical_network
      # JSON array of ports with stable labels. Change/delete/rename labels
      # manually. Optional per-port "switch_id" (real switch MAC) overrides the
      # 00:00:00:00:00:00 placeholder, e.g.
      # [{"label":"port1","mac":"..","switch":"..","intf":"..","switch_id":".."}]
      - name: ports
      - name: external_cmdb_id
        value: ""
      - name: resource_class
        value: generic
  templates:
    - name: main
      inputs:
        parameters:
          - name: post_enroll_workflows
            valueFrom:
              configMapKeyRef:
                name: enroll-netdev-config
                key: post_enroll_workflows
              default: "[]"
      outputs:
        parameters:
          - name: node_uuid
            valueFrom:
              parameter: "{{steps.enroll-netdev.outputs.parameters.node_uuid}}"
      steps:
        - - name: enroll-netdev
            template: enroll-netdev
        - - name: post-enroll
            templateRef:
              name: "{{item}}"
              template: run
            arguments:
              parameters:
                - name: node_uuid
                  value: "{{steps.enroll-netdev.outputs.parameters.node_uuid}}"
            withParam: "{{inputs.parameters.post_enroll_workflows}}"
    - name: enroll-netdev
      outputs:
        parameters:
          - name: node_uuid
            valueFrom:
              path: /run/enrollment/node-uuid
      container:
        image: ghcr.io/rackerlabs/understack/ironic-nautobot-client:latest
        command:
          - enroll-netdev
        args:
          - --node-uuid-output
          - /run/enrollment/node-uuid
          - --name
          - "{{workflow.parameters.name}}"
          - --physical-network
          - "{{workflow.parameters.physical_network}}"
          - --ports
          - "{{workflow.parameters.ports}}"
          - --external-cmdb-id
          - "{{workflow.parameters.external_cmdb_id}}"
          - --resource-class
          - "{{workflow.parameters.resource_class}}"
        volumeMounts:
          - mountPath: /run/enrollment
            name: enrollment-result
          - mountPath: /etc/openstack
            name: baremetal-manage
            readOnly: true
        envFrom:
          - configMapRef:
              name: cluster-metadata
        env:
          - name: WF_NS
            value: "{{workflow.namespace}}"
          - name: WF_NAME
            value: "{{workflow.name}}"
          - name: WF_UID
            value: "{{workflow.uid}}"
          - name: OS_CLOUD
            value: understack
