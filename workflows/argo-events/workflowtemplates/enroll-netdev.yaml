---
apiVersion: argoproj.io/v1alpha1
metadata:
  name: enroll-netdev
  annotations:
    workflows.argoproj.io/title: Enroll a network device in Ironic
    workflows.argoproj.io/description: |
      Defined in `workflows/argo-events/workflowtemplates/enroll-netdev.yaml`
kind: WorkflowTemplate
spec:
  serviceAccountName: workflow
  entrypoint: main
  volumes:
    - name: baremetal-manage
      secret:
        secretName: baremetal-manage
        items:
          - key: clouds.yaml
            path: clouds.yaml
  arguments:
    parameters:
      - name: name
      - name: physical_network
      # JSON array of ports with stable labels. Change/delete/rename labels
      # manually. Optional per-port "switch_id" (real switch MAC) overrides the
      # 00:00:00:00:00:00 placeholder, e.g.
      # [{"label":"port1","mac":"..","switch":"..","intf":"..","switch_id":".."}]
      - name: ports
      - name: external_cmdb_id
        value: ""
      - name: resource_class
        value: generic
  templates:
    - name: main
      steps:
        - - name: enroll-netdev
            template: enroll-netdev
    - name: enroll-netdev
      container:
        image: ghcr.io/rackerlabs/understack/ironic-nautobot-client:latest
        command:
          - enroll-netdev
        args:
          - --name
          - "{{workflow.parameters.name}}"
          - --physical-network
          - "{{workflow.parameters.physical_network}}"
          - --ports
          - "{{workflow.parameters.ports}}"
          - --external-cmdb-id
          - "{{workflow.parameters.external_cmdb_id}}"
          - --resource-class
          - "{{workflow.parameters.resource_class}}"
        volumeMounts:
          - mountPath: /etc/openstack
            name: baremetal-manage
            readOnly: true
        envFrom:
          - configMapRef:
              name: cluster-metadata
        env:
          - name: WF_NS
            value: "{{workflow.namespace}}"
          - name: WF_NAME
            value: "{{workflow.name}}"
          - name: WF_UID
            value: "{{workflow.uid}}"
          - name: OS_CLOUD
            value: understack
