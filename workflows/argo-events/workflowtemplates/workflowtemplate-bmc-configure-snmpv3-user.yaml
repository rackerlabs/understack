apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: bmc-configure-snmpv3-user
  annotations:
    workflows.argoproj.io/title: Configure the SNMPv3 user on a node BMC
    workflows.argoproj.io/description: |
      Defined in `workflows/argo-events/workflowtemplates/workflowtemplate-bmc-configure-snmpv3-user.yaml`

      Applies the bmc-configure-snmpv3-user runbook to the specified Ironic node.
      Active nodes use out-of-band servicing and return to active on success.
      Available or manageable nodes use the existing manual cleaning path.
spec:
  entrypoint: run
  serviceAccountName: workflow
  arguments:
    parameters:
      - name: node_uuid
  templates:
    - name: run
      inputs:
        parameters:
          - name: node_uuid
      synchronization:
        mutexes:
          - name: ironic-runbooks-{{inputs.parameters.node_uuid}}
      volumes:
        - name: openstack
          secret:
            secretName: baremetal-manage
            items:
              - key: clouds.yaml
                path: clouds.yaml
      container:
        image: ghcr.io/rackerlabs/understack/ironic-nautobot-client:pr-2607
        command:
          - apply-node-runbook
        args:
          - --node
          - "{{inputs.parameters.node_uuid}}"
          - --runbooks
          - '["bmc-configure-snmpv3-user"]'
        envFrom:
          - configMapRef:
              name: cluster-metadata
        env:
          - name: OS_CLOUD
            value: understack
        volumeMounts:
          - name: openstack
            mountPath: /etc/openstack
            readOnly: true
