---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: snmpv3-password
  annotations:
    workflows.argoproj.io/title: Obtain per-node SNMPv3 credentials
    workflows.argoproj.io/description: |
      Defined in `workflows/argo-events/workflowtemplates/snmpv3-password.yaml`

      Prints credentials to workflow logs, like bmc-password. Use the same
      master as the conductor. The image must contain ironic.common.snmpv3.
      The ironic-snmpv3-master Secret must exist in the workflow namespace.
      This only derives credentials; run configure_snmpv3_user to program the BMC.

      Set NODE to the Ironic node UUID and use the appropriate OS_CLOUD.
      Read the service tag from its inspection inventory, then submit:

      ```
      SERVICE_TAG=$(openstack baremetal node inventory save "$NODE" \
        | jq -r '.inventory.system_vendor.serial_number')

      argo -n argo-events submit --from workflowtemplate/snmpv3-password \
        -p service_tag="$SERVICE_TAG" --watch
      ```
      The optional prefix parameter defaults to uc. Override with
      -p prefix=ucsl1 to match a conductor configured with that prefix.
      Prefixes accept 1 to 16 lowercase ASCII letters or digits and affect
      only the username, not the passphrases.

      Use username, auth_passphrase and privacy_passphrase from the logs in
      the monitoring system. Authentication and privacy protocols must match
      the configure_snmpv3_user runbook (defaults: SHA and AES).
spec:
  serviceAccountName: workflow
  entrypoint: main
  arguments:
    parameters:
      - name: service_tag
      # Match conf.ironic.drac.snmpv3_username_prefix in conductor Helm values.
      - name: prefix
        value: uc
  volumes:
    - name: snmpv3-master
      secret:
        secretName: ironic-snmpv3-master
        items:
          - key: snmpv3.conf
            path: snmpv3.conf
  templates:
    - name: main
      container:
        image: ghcr.io/rackerlabs/understack/ironic:2026.1
        command:
          - python
          - -m
          - ironic.common.snmpv3
        # This workflow does not read the conductor's Helm values at
        # conf.ironic.drac.snmpv3_username_prefix. Set the prefix parameter to
        # the same value so the derived username matches the BMC account.
        args:
          - "{{workflow.parameters.service_tag}}"
          - --config-file
          - /etc/snmpv3/snmpv3.conf
          - --prefix
          - "{{workflow.parameters.prefix}}"
        volumeMounts:
          - name: snmpv3-master
            mountPath: /etc/snmpv3
            readOnly: true
