---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ansible-workflow-template
  annotations:
    workflows.argoproj.io/title: Run arbitrary ansible playbook from the undercloud-rackspace repo
    workflows.argoproj.io/description: |
      Defined in `workflows/argo-events/workflowtemplates/ansible-run.yaml`
spec:
  serviceAccountName: workflow
  templates:
  - name: ansible-run
    inputs:
      parameters:
      - name: playbook
        default: "initial-setup.yml"
      - name: extra_vars
        default: "var=default"
      - name: inventory_file
        default: /runner/inventory/hosts.yaml
      - name: project_path
        default: /runner/project
    container:
      # renovate: datasource=docker depName=ghcr.io/rss-engineering/undercloud-nautobot/ansible
      image: ghcr.io/rss-engineering/undercloud-nautobot/ansible:0.1.1
      command: [ansible-runner]
      args:
      - run
      - /tmp/runner
      - --project-dir
      - "{{ inputs.parameters.project_path }}"
      - --playbook
      - "{{ inputs.parameters.playbook }}"
      - --cmdline=-i {{ inputs.parameters.inventory_file }} --extra-vars '{{ inputs.parameters.extra_vars }} env=$(UNDERSTACK_PARTITION) site=$(UNDERSTACK_SITE) partition=$(UNDERSTACK_PARTITION)' -vvv
      env:
      - name: NAUTOBOT_TOKEN
        valueFrom:
          secretKeyRef:
            key: token
            name: nautobot-token
      - name: NAUTOBOT_URL
        valueFrom:
          secretKeyRef:
            name: nautobot-token
            key: url
      # PAN-OS credentials (factory -> preconfig -> standard -> TACACS)
      - name: PANOS_FACTORY_USERNAME
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: panos_factory_username
            optional: true
      - name: PANOS_FACTORY_PASSWORD
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: panos_factory_password
            optional: true
      - name: PANOS_PRECONFIG_USERNAME
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: panos_preconfig_username
            optional: true
      - name: PANOS_PRECONFIG_PASSWORD
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: panos_preconfig_password
            optional: true
      - name: PANOS_STANDARD_USERNAME
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: panos_standard_username
            optional: true
      - name: PANOS_STANDARD_PASSWORD
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: panos_standard_password
            optional: true
      # F5 credentials (factory -> preconfig -> standard -> TACACS)
      - name: F5_FACTORY_ROOT_USERNAME
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: f5_factory_root_username
            optional: true
      - name: F5_FACTORY_ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: f5_factory_root_password
            optional: true
      - name: F5_FACTORY_ADMIN_USERNAME
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: f5_factory_admin_username
            optional: true
      - name: F5_FACTORY_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: f5_factory_admin_password
            optional: true
      - name: F5_PRECONFIG_ROOT_USERNAME
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: f5_preconfig_root_username
            optional: true
      - name: F5_PRECONFIG_ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: f5_preconfig_root_password
            optional: true
      - name: F5_PRECONFIG_ADMIN_USERNAME
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: f5_preconfig_admin_username
            optional: true
      - name: F5_PRECONFIG_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: f5_preconfig_admin_password
            optional: true
      - name: F5_STANDARD_ROOT_USERNAME
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: f5_standard_root_username
            optional: true
      - name: F5_STANDARD_ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: f5_standard_root_password
            optional: true
      - name: F5_STANDARD_ADMIN_USERNAME
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: f5_standard_admin_username
            optional: true
      - name: F5_STANDARD_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: f5_standard_admin_password
            optional: true
      # TACACS credentials (A-side and B-side for redundancy)
      - name: TACACS_USER_A
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: tacacs_user_a
            optional: true
      - name: TACACS_PASS_A
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: tacacs_pass_a
            optional: true
      - name: TACACS_USER_B
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: tacacs_user_b
            optional: true
      - name: TACACS_PASS_B
        valueFrom:
          secretKeyRef:
            name: network-device-credentials
            key: tacacs_pass_b
            optional: true
      envFrom:
      - configMapRef:
          name: cluster-metadata
          optional: false
