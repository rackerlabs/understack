apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: delete-server
  annotations:
    workflows.argoproj.io/title: Run server deletion cleanup
    workflows.argoproj.io/description: |
      Run configured cleanup hooks after an Ironic node is deleted.
      All hooks must succeed for the workflow to complete.
      Hooks: delete-server-config.pre_delete_workflows; [] skips cleanup.
      The ConfigMap requires workflows.argoproj.io/configmap-type: Parameter.
spec:
  workflowMetadata:
    labels:
      understack.rackspace.com/workflow-kind: delete
      understack.rackspace.com/device-type: server
  entrypoint: main
  serviceAccountName: workflow
  # Bound lock waiting and all cleanup hooks in the submitted workflow.
  activeDeadlineSeconds: 3600
  arguments:
    parameters:
      - name: node_uuid
        description: "Ironic node UUID to delete."
      # Omitted: use site configuration. Explicit []: skip pre-deletion hooks.
      - name: pre_delete_workflows
        description: "JSON list of cleanup workflows. Omit to use site config; [] skips hooks."
        valueFrom:
          configMapKeyRef:
            name: delete-server-config
            key: pre_delete_workflows
          default: "[]"
  templates:
    - name: main
      inputs:
        parameters:
          - name: node_uuid
          - name: pre_delete_workflows
            value: "{{workflow.parameters.pre_delete_workflows}}"
      # Share registration's per-node lock while running cleanup hooks.
      # Hooks must not acquire this same lock again.
      synchronization:
        mutexes:
          - name: "server-node-{{inputs.parameters.node_uuid}}"
      steps:
        - - name: pre-delete
            templateRef:
              name: "{{item}}"
              template: run
            arguments:
              parameters:
                - name: node_uuid
                  value: "{{inputs.parameters.node_uuid}}"
            withParam: "{{inputs.parameters.pre_delete_workflows}}"
