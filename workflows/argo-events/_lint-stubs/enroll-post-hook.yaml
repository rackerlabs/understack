# Lint-only placeholder. NOT deployed to any real environment.
#
# enroll-server.yaml references the `enroll-post-hook` WorkflowTemplate via
# templateRef. The real implementation is site-specific and installed from
# undercloud-deploy only where a site opts in (e.g. SL1); it is intentionally
# absent from this repo. `argo lint` resolves templateRef names against the
# cluster, so this minimal stub is deployed into the lint cluster purely so the
# reference resolves. Its body is irrelevant to linting -- only the kind, name,
# and the `run` template with a `node_uuid` input matter.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: enroll-post-hook
spec:
  entrypoint: run
  templates:
    - name: run
      inputs:
        parameters:
          - name: node_uuid
      container:
        image: busybox
        command: ["true"]
