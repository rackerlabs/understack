; Configuration for the generated "Unreleased" page.
;
; scriv has no --draft mode, so `make docs` renders the pending fragments by
; collecting them into a throwaway page with --keep, which leaves the fragments
; in place. docs/release-notes/unreleased.md is generated and gitignored; never
; edit it directly.
;
; This exists as a second config file rather than as flags on the main one
; because `changelog` is not overridable from the command line.
;
; Keep `categories` identical to scriv.ini, or a fragment category will render
; on one page and vanish from the other.

[scriv]
format = md
fragment_directory = changelog.d
changelog = docs/release-notes/unreleased.md

categories =
    Action required,
    Deploy repo changes,
    Deprecations and removals,
    Notes

md_header_level = 2
entry_title_template = Pending changes
new_fragment_template = file: new_fragment.md.j2
