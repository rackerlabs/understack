; Configuration for scriv, which assembles docs/release-notes/ from the
; fragment files in this directory.
;
; Two constraints worth knowing before you move anything:
;
;   * scriv only reads this file when it sits inside the fragment directory. A
;     scriv.ini at the repository root is silently ignored.
;   * `changelog` is resolved relative to the current working directory, so
;     every scriv command has to be run from the repository root.
;
; This is an INI file read through configparser, so a literal % must be
; written as %%.

[scriv]
format = md
fragment_directory = changelog.d

; The current series page. Bump this to release-notes/v0.5.md when the v0.5
; series opens -- it is the only edit a minor release needs here.
changelog = docs/release-notes/v0.4.md

; Categories are headings inside the fragment, not part of its filename. Keep
; this list in sync with new_fragment.md.j2 and with unreleased.ini.
categories =
    Action required,
    Deploy repo changes,
    Deprecations and removals,
    Notes

; The series pages use `## <version>` with `### <category>` beneath, so the
; version heading is level 2.
md_header_level = 2

entry_title_template = {{ version }} — released {{ date.strftime('%%Y-%%m-%%d') }}
new_fragment_template = file: new_fragment.md.j2
