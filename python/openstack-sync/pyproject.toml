[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "openstack-sync"
description = "Shell-operator hooks for OpenStack reconciliation"
authors = [{ name = "Understack Developers" }]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
dynamic = ["version"]
dependencies = [
    "kubernetes>=32.0.0",
    "openstacksdk>=4.18.0",
    "python-ironicclient>=6.2.0",
    "python-openstackclient>=10.2.1",
]

[project.urls]
Homepage = "https://github.com/rackerlabs/understack"
Issues = "https://github.com/rackerlabs/understack/issues"

[dependency-groups]
test = [
    "pytest<10",
    "pytest-github-actions-annotate-failures",
    "pytest-cov>=6.1.0",
]

[tool.uv]
default-groups = ["test"]

[tool.hatch.build.targets.sdist]
include = ["openstack_sync"]

[tool.hatch.build.targets.wheel]
include = ["openstack_sync"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../../"
tag_regex = "^openstack-sync/v(?P<version>.*)$"
git_describe_command = "git describe --dirty --tags --long --match openstack-sync/v*"
fallback_version = "0.1.0"

[tool.ruff]
target-version = "py312"
fix = true

[tool.ruff.lint]
select = [
  "D",       # pydocstyle
  "E",       # pycodestyle (error)
  "F",       # pyflakes
  "B",       # flake8-bugbear
  "I",       # isort
  "S",       # flake8-bandit
  "UP",      # pyupgrade
  "ASYNC",   # flake8-async
]

ignore = [
    "D100",  # don't require docs for every module
    "D101",  # don't require docs for every class
    "D102",  # don't require docs for every class method
    "D103",  # don't require docs for every function
    "D104",  # don't require docs for every package
    "D106",  # don't require docs for every nested class
    "D107",  # don't require docs for __init__
    "D417",  # don't require docs for every function parameter
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
# enable the google doc style rules by default
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # assert is the point in tests
    # Fixtures name Kubernetes Secrets, which flake8-bandit reads as passwords.
    "S105",
    "S106",
    "S107",
]
