[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neutron-understack"
version = "0.1.0"
description = "Undercloud's ML2 driver for neutron"
authors = [{ name = "Understack Developers" }]
requires-python = "~=3.12.0"
readme = "README.rst"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: OpenStack",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2,<3",
    "neutron-lib>=3,<5",
    "neutron>=27,<29",
    "oslo.config>=9.7.1",
    "oslo.log>=7.1.0",
    "openstacksdk>=4.9.0",
    "keystoneauth1>=3.14.0",
]

[project.entry-points."oslo.config.opts"]
ironic = "neutron_understack.config:list_ironic_opts"
understack = "neutron_understack.config:list_understack_opts"
cisco-asa = "neutron_understack.config:list_cisco_asa_opts"
understack-vni = "neutron_understack.config:list_understack_vni_opts"

[project.entry-points."neutron.ml2.mechanism_drivers"]
understack = "neutron_understack.neutron_understack_mech:UnderstackDriver"
undersync = "neutron_understack.undersync_mech:UndersyncDriver"

[project.entry-points."neutron.service_plugins"]
l3_service_cisco_asa = "neutron_understack.l3_service_cisco_asa:CiscoAsa"
understack_vni = "neutron_understack.l3_router.vrf:UnderstackVniPlugin"

[project.entry-points."oslo.policy.policies"]
neutron-understack = "neutron_understack.conf.policies:list_rules"

[project.entry-points."neutron.policies"]
neutron-understack = "neutron_understack.conf.policies:list_rules"

[project.entry-points."neutron.db.alembic_migrations"]
neutron-understack = "neutron_understack.db.migration:alembic_migrations"

[project.urls]
Source = "https://github.com/rackerlabs/understack"

[dependency-groups]
test = [
    "pytest>=9.0.1,<10",
    "pytest-cov>=7,<8",
    "pytest-mock>=3.14.0,<4",
    "sqlalchemy",
    # Base classes reused from neutron.tests (Ml2PluginV2TestCase et al.) sit on
    # top of neutron's own test-only stack, which is not pulled in when neutron
    # is installed as a runtime dependency.
    "oslotest",
    "testtools",
    "fixtures",
    "webtest",
    "testresources",
    "testscenarios",
]

[tool.uv]
default-groups = ["test"]

# Test against the same neutron/neutron-lib the container ships (the
# understack/2026.1 fork), not PyPI. Keep these revs in lockstep with
# containers/neutron/Dockerfile (NEUTRON_GIT_REF / NEUTRON_LIB_GIT_REF).
[tool.uv.sources]
# renovate: name=openstack/neutron repo=https://github.com/rackerlabs/neutron.git branch=understack/2026.1
neutron = { git = "https://github.com/rackerlabs/neutron.git", rev = "b0678e56e9c5a7ec2f335c4271465fc1c3202e2a" }
# renovate: name=openstack/neutron-lib repo=https://github.com/rackerlabs/neutron-lib.git branch=understack/2026.1
neutron-lib = { git = "https://github.com/rackerlabs/neutron-lib.git", rev = "6d0367183cc92656ba449acefd830cb4e11f2f5b" }

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --strict-markers"
filterwarnings = "ignore::DeprecationWarning"
markers = [
    "scenario(id): links a test to a scenario ID in tests/scenarios/SCENARIOS.md",
]

[tool.ruff]
# use our default and override anything we need specifically
extend = "../pyproject.toml"
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"neutron_understack/tests/*.py" = [
    "S311",     # allow non-cryptographic secure bits for test data
    "S101",
    "RUF012",   # test fixture classes often use mutable class-level data
    "S105",     # allow hardcoded passwords for testing
    "S106",     # allow hardcoded passwords for testing
]
