---

- name: Loop to create secret
  ansible.builtin.include_tasks: secret.yml
  loop: "{{ item.value }}"
  loop_control:
    loop_var: single_secret

- name: Initialize secret group associations
  ansible.builtin.set_fact:
    secrets_group_associations: []

- name: Build secret group associations
  ansible.builtin.set_fact:
    secrets_group_associations: "{{ secrets_group_associations + [association] }}"
  vars:
    association:
      access_type: "{{ secrets_list.access_type }}"
      secret_type: "{{ secrets_list.secret_type }}"
      secret: "{{ secrets_list.name }}"
  loop: "{{ item.value }}"
  loop_control:
    loop_var: secrets_list

- name: Create the Secret Group
  networktocode.nautobot.secrets_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: "{{ item.key }}"
    secrets:
      state: merge
      objects: "{{ secrets_group_associations }}"
